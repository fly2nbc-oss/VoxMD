[package]
name = "voxmd"
version = "1.1.0"
description = "Transcribe audio and podcast episodes to Markdown with local Whisper and an LLM summary"
authors = ["VoxMD contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "voxmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU: `cargo tauri build --features gpu-vulkan` (Vulkan SDK/headers at build time).
# The Vulkan *loader* is opened at runtime via a stub — missing libvulkan.so does not block startup.
default = []
gpu-vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "fs", "time"] }
whisper-rs = { version = "0.16", default-features = false }
# Only the chat-completion API is used; 0.41 ships every other endpoint behind
# its own feature and enables none of them by default.
async-openai = { version = "0.41", default-features = false, features = [
    "rustls",
    "chat-completion",
] }
lofty = "0.24"
# Formats claimed in README: MP3, M4A/MP4, WAV, OGG, FLAC, WebM/MKV, AIFF, CAF (+ PCM).
# `all` also pulls ALAC/ADPCM and is unnecessary attack surface.
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "wav",
    "ogg",
    "flac",
    "vorbis",
    "mkv",
    "aiff",
    "caf",
    "pcm",
    "opt-simd",
    "all-meta",
] }
# Always-on platform backends (D-Bus inhibit on Linux, SetThreadExecutionState on Windows).
keepawake = "0.6"
cpal = "0.15"
# `load-dynamic` on both: onnxruntime is fetched at runtime into the diarization
# cache instead of being linked in — it was 18.7 MB of binary for a feature that
# is off by default. See `onnx_runtime.rs`.
pyannote-rs = { version = "0.3", features = ["load-dynamic"] }
# pyannote-rs 0.3.4 declares `ort = "2.0.0-rc.10"`, which also matches later
# rcs. rc.13 pulled a second `ndarray` and SessionBuilder is not Send/Sync, so
# the crate does not compile. Pin the version it was written against.
# Do NOT add `alternative-backend` here. It looks like a way to stop
# `download-binaries` — still enabled through pyannote-rs's ort defaults, which
# a dependent cannot switch off — from fetching a 94 MB static archive on every
# clean build. But it also swaps `ort::api()` from `get_or_init(|| dlopen(…))`
# to a bare `get()`, so `load-dynamic` never runs and the first Session panics
# with "attempted to use `ort` APIs before initializing a backend". The build
# and every unit test still pass; only real diarization breaks.
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "ndarray",
    "std",
    "load-dynamic",
] }
# Unpacking the onnxruntime release asset (.tgz on Linux/macOS, .zip on Windows)
# and checking its published hash.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
# Same ndarray as pyannote-rs/ort — used by our local segmentation (upstream 0.3.4
# feeds raw i16 to the ONNX model, so every frame looks like non-speech).
ndarray = "0.16"
# 0.13 renamed the `rustls-tls` feature to `rustls`. Kept in lockstep with
# async-openai so the binary links one HTTP stack, not two.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
feed-rs = "2"
futures = "0.3"
dirs = "6"
sys-locale = "0.3"

# Release: smaller binary and faster Whisper inference matter more than link time.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Dev: whisper.cpp is unusable-slow at opt-level 0; compile deps optimized.
[profile.dev.package."*"]
opt-level = 3
