<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #f2f4f7; --surface: #ffffff; --surface-muted: #f8f9fb;
      --text: #1a2330; --muted: #52637a;
      --line: #d4dce6; --line-soft: #e6ecf2;
      --accent: #3b5f8a; --accent-subtle: #ebf0f7;
      --ok: #1a7f5a; --ok-bg: #e6f4ee;
      --warn: #d4700a; --warn-bg: #fef3e6;
      --err: #c0392b; --err-bg: #fdeceb;
      --shadow: 0 10px 28px rgba(26, 35, 48, 0.08);
      --header-bg: #e8eef5; --row-hover: #f0f4f9;
      --mono: "Consolas", "Courier New", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13px; }
    a { color: var(--accent); } a:hover { color: #2d4d73; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 12px; font-weight: 600; padding: 9px 10px;
         background: var(--header-bg); border-bottom: 1px solid var(--line-soft); color: var(--text); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: top; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
             border-radius: 999px; font-size: 11px; font-weight: 600; }
    .neutral { color: var(--muted); background: var(--surface-muted); }
    .active { color: var(--accent); background: var(--accent-subtle); }
    .btn { min-height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
           border-radius: 6px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ico { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center;
           justify-content: center; color: var(--muted); }
    .on { color: var(--accent); background: var(--accent-subtle); }
    .danger { color: var(--err); background: var(--err-bg); }
    .mono { font-family: var(--mono); }
  </style>
</helmet>

<div style="width: 1180px; height: 760px; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--bg); color: var(--text);">

  <!-- Symbolleiste -->
  <div style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); flex-shrink: 0;">
    <strong style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; padding-right: 4px; border-right: 1px solid var(--line-soft);">VoxMD</strong>
    <div style="display: flex; gap: 2px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; background: var(--accent-subtle); color: var(--accent); font-size: 12px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Queue
      </span>
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-size: 12px; color: var(--text);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Dictation
      </span>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; min-width: 0;">
      <span class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="10" cy="15" r="2"/><path d="M12 15v-4l3 1"/></svg>Files</span>
      <span class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/></svg>Podcast</span>
      <span class="btn" style="opacity: 0.4;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 6h13M3 12h9M3 18h9"/><path d="m16 15 5 5M21 15l-5 5"/></svg>Remove</span>
      <span class="btn btn-primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="m6 4 14 8-14 8z"/></svg>Start</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding-left: 4px; border-left: 1px solid var(--line-soft);">
      <span class="ico on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
      <span class="ico on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/></svg></span>
      <span class="ico on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/></svg></span>
      <span class="ico danger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></span>
      <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 3h.1a2 2 0 1 1 4 0V3a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.6z"/></svg></span>
    </div>
  </div>

  <!-- Inhalt -->
  <div style="flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;">
    <div style="flex: 1; overflow: hidden;">
      <table>
        <thead>
          <tr>
            <th style="width: 34px;"><input type="checkbox"></th>
            <th style="width: 40%;">File / Episode</th>
            <th style="width: 90px;">Status</th>
            <th>Details</th>
            <th style="width: 72px;"></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
            <tr>
              <td><input type="checkbox"></td>
              <td class="mono">{{r.name}}</td>
              <td><span class="badge {{r.cls}}">{{r.badge}}</span></td>
              <td class="mono" style="color: var(--muted);">{{r.detail}}</td>
              <td></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <!-- Fußzeile -->
    <div style="min-height: 26px; padding: 2px 12px; background: var(--surface-muted); border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;">
      <span>Overall: 0 / 1 done (MD)</span>
      <div style="height: 8px; background: var(--line-soft); border-radius: 999px; overflow: hidden; flex: 1; max-width: 320px;">
        <div style="height: 100%; width: 4%; background: var(--accent); border-radius: 999px;"></div>
      </div>
      <span class="mono" style="max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Transcription task failed: task 65 panicked with message "attempted to u…</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1180,"height":760}}'>
const EPISODES = [
  "2026-08-21 · #368: 200 Strafanzeigen gegen Biontec und PEI - mit Katharina König u. Tobias Ulbrich",
  "2026-08-14 · #367: Absturz deutscher Wissenschaft - mit Prof. Dr. Henrieke Stahl",
  "2026-08-07 · #366: „Wir brauchen keine Politiker“ - mit Prof. Dr. Michael Esfeld",
  "2026-07-31 · #365: „Fauci würde ich gerne im Knast sehen“ - mit Heinrich Habig",
  "2026-07-24 · #364: „Cholesterin-Pillen erhöhen Demenz-Risiko“ - mit Dr. Michael Spitzbart",
  "2026-07-17 · #363: „Politischer Islam will Europa erobern“ - mit Seyran Ates",
  "2026-07-10 · #362: „Der neue Feudalismus“ - mit Hermann Ploppa",
  "2026-07-03 · #361: „AfD ist außenpolitisch links“ - mit Oskar Lafontaine",
  "2026-06-26 · #360: „USA wollen Deutschland kannibalisieren“ - mit Moritz Enders u. Erik Andersson",
  "2026-06-19 · #359: Klima-Inferno abgesagt – Merz macht weiter - mit Prof. Dr. Fritz Vahrenholt",
  "2026-06-12 · #358: „Rechne im Herbst mit Krawallen“ - mit Waldemar Hartmann",
  "2026-06-05 · #357: „Woke und wehrhaft“ - mit Dr. Leo Ensel",
];

class Component extends DCLogic {
  renderVals() {
    return {
      rows: EPISODES.map((name, i) => ({
        name,
        badge: i === 1 ? "Speakers" : "Wait",
        cls: i === 1 ? "active" : "neutral",
        detail: i === 1 ? "Separating speakers…" : "Waiting in queue…",
      })),
    };
  }
}
</script>
</body>
</html>
