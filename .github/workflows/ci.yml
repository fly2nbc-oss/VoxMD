name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Lint & Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # No version here: rust-toolchain.toml pins it for CI and local checkouts
      # alike, so a lint added by a newer stable cannot appear only in CI.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo clippy --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            llvm-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check & frontend build
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # Kept separate from `check` so the cheap feedback (eslint, tsc, fmt, clippy,
  # tests) still returns in a couple of minutes: compiling whisper.cpp with
  # Vulkan takes far longer than everything else here combined.
  vulkan:
    name: Vulkan feature checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VULKAN_SDK: /usr
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: vulkan

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            llvm-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc

      # Releases are built with this feature, but nothing used to compile or test
      # it before the (much slower) platform builds, so a break in the Vulkan
      # runtime probe or the loader stub surfaced late.
      - name: Clippy & tests (gpu-vulkan)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --locked --features gpu-vulkan -- -D warnings
          cargo test --locked --features gpu-vulkan

      # The loader stub exists so a machine without libvulkan can still start the
      # app. If libvulkan ends up in DT_NEEDED that guarantee is silently gone.
      - name: Verify Vulkan loader is not a hard link-time dependency
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo build --locked --features gpu-vulkan --lib
          lib="target/debug/libvoxmd_lib.so"
          # Fail rather than skip if the artifact moved, so this cannot quietly
          # degrade into a check that always passes.
          if [ ! -f "$lib" ]; then
            echo "::error::$lib not found; update this check to match the build output."
            exit 1
          fi
          if objdump -p "$lib" | grep -i 'NEEDED.*vulkan'; then
            echo "::error::libvulkan is a hard dependency; the dlopen stub is not being linked, so the app will not start on machines without a Vulkan loader."
            exit 1
          fi
          echo "OK: no libvulkan entry in DT_NEEDED."

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    needs: [check, vulkan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: Linux
          - platform: windows-latest
            name: Windows
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set Windows build paths (before rust-cache)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) {
            echo "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          }
          echo "CARGO_TARGET_DIR=C:/cargo-target" >> $env:GITHUB_ENV
          echo "CMAKE_BUILD_PARALLEL_LEVEL=1" >> $env:GITHUB_ENV

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Windows builds to C:/cargo-target; caching target often exceeds GitHub's 10GB limit.
          cache-targets: ${{ matrix.platform != 'windows-latest' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            llvm-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc

      - name: Set VULKAN_SDK (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK not found under C:\VulkanSDK"
          }
          echo "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          echo "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Vulkan)
        run: npm run tauri -- build --features gpu-vulkan

      - name: Upload Windows portable EXE (no installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-dist | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/voxmd.exe" "portable-dist/VoxMD.exe"

      - name: Upload portable artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: voxmd-windows-amd64-portable-exe
          path: portable-dist/VoxMD.exe
