name: Release

on:
  push:
    tags:
      - 'v*'

# One release run per tag; never cancel a publish in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A tag used to be able to ship code that had never run fmt, clippy or the
  # tests, and a tag whose number disagreed with tauri.conf.json would scatter
  # binaries and checksums across two different releases.
  verify:
    name: Verify tag & run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in the manifests
        id: version
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"

          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$crate"
          for got in "$conf" "$pkg" "$crate"; do
            if [ "$got" != "$tag" ]; then
              echo "::error::Tag v$tag does not match all manifests (tauri.conf.json=$conf, package.json=$pkg, Cargo.toml=$crate)."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            llvm-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check & frontend build
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        env:
          VULKAN_SDK: /usr
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features gpu-vulkan -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          VULKAN_SDK: /usr
        run: |
          cargo test --locked
          cargo test --locked --features gpu-vulkan

  # Created once, up front, as a draft. Both build jobs previously called
  # tauri-action concurrently for the same tag, racing to create the release.
  create_release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's changelog section
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for $version." > release-notes.md
          fi
          {
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | Files |"
            echo "|----------|-------|"
            echo "| Windows  | Portable \`VoxMD.exe\` (no installer), plus \`.msi\` and NSIS setup \`.exe\` |"
            echo "| Linux    | \`.AppImage\` or \`.deb\` |"
            echo ""
            echo "Verify downloads against the \`SHA256SUMS-*.txt\` files attached to this release."
          } >> release-notes.md
          cat release-notes.md

      - name: Create draft release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoxMD ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.name }})
    needs: [verify, create_release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: Linux
            sha_suffix: linux
          - platform: windows-latest
            name: Windows
            sha_suffix: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set Windows build paths (before rust-cache)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) {
            echo "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          }
          echo "CARGO_TARGET_DIR=C:/cargo-target" >> $env:GITHUB_ENV
          echo "CMAKE_BUILD_PARALLEL_LEVEL=1" >> $env:GITHUB_ENV

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: ${{ matrix.platform != 'windows-latest' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            llvm-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc

      - name: Set VULKAN_SDK (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK not found under C:\VulkanSDK"
          }
          echo "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          echo "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles (Vulkan)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create_release.outputs.release_id }}
          args: --features gpu-vulkan

      - name: Prepare Windows portable EXE (rename for release)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-dist | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/voxmd.exe" "portable-dist/VoxMD.exe"
          Get-Item "portable-dist/VoxMD.exe"

      - name: Generate SHA256SUMS (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          OUT: ${{ github.workspace }}/SHA256SUMS-${{ matrix.sha_suffix }}.txt
          BUNDLE_DIR: src-tauri/target/release/bundle
        run: |
          set -eu
          cd "$BUNDLE_DIR"
          # Bare filenames, matching the Windows side and the names on the release.
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec sha256sum {} \; \
            | sed 's| \./.*/| |' \
            | sort > "$OUT"
          if [ ! -s "$OUT" ]; then
            echo "::error::No Linux bundles found under $BUNDLE_DIR."
            exit 1
          fi
          cat "$OUT"

      - name: Generate SHA256SUMS (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          OUT: ${{ github.workspace }}/SHA256SUMS-${{ matrix.sha_suffix }}.txt
        run: |
          $out = @()
          $bundleRoot = "$env:CARGO_TARGET_DIR/release/bundle"
          if (Test-Path $bundleRoot) {
            Get-ChildItem -Path $bundleRoot -Recurse `
              -Include "*.msi","*.exe","*.nsis" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                $out += "$hash  $($_.Name)"
              }
          }
          Get-ChildItem -Path "portable-dist" -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              $out += "$hash  $($_.Name)"
            }
          if ($out.Count -eq 0) {
            Write-Error "No Windows artifacts found to checksum."
            exit 1
          }
          $out | Sort-Object | Set-Content $env:OUT
          Get-Content $env:OUT

      # `gh` is used rather than a tag-based upload action: a draft release is not
      # returned by GET /releases/tags/{tag}, so an action that resolves by tag
      # would create a *second* draft instead of adding to this one. `gh` falls
      # back to listing releases and so finds the draft.
      - name: Attach checksums (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            "SHA256SUMS-${{ matrix.sha_suffix }}.txt"

      - name: Attach checksums + portable EXE (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --clobber \
            "SHA256SUMS-${{ matrix.sha_suffix }}.txt" \
            "portable-dist/VoxMD.exe"

  # Only flip the release live once every platform actually produced artifacts.
  publish:
    name: Publish release
    needs: [verify, create_release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
